name: Build & Release Signed APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.1.0)'
        required: true
        default: 'v2.1.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # HEAD~1 is needed to tell whether the version was bumped.
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decide whether to release
        id: gate
        run: |
          set -e
          APP_VER=$(sed -n 's/^app\.versionName=//p' gradle.properties | head -n1)
          if [ -z "$APP_VER" ]; then
            echo "::error::app.versionName is missing from gradle.properties"
            exit 1
          fi
          PREV_VER=$(git show HEAD~1:gradle.properties 2>/dev/null | sed -n 's/^app\.versionName=//p' | head -n1 || true)
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ] && [ "$APP_VER" = "$PREV_VER" ]; then
            echo "Version unchanged ($APP_VER) - no release for this push."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$APP_VER" >> "$GITHUB_OUTPUT"

      - name: Determine version
        id: ver
        if: steps.gate.outputs.release == 'true'
        run: |
          set -e
          APP_VER="${{ steps.gate.outputs.version }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$APP_VER"
          fi
          VER="${TAG#v}"
          # Monotonic per run so Android accepts the APK as an update.
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: steps.gate.outputs.release == 'true'
        run: |-
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ steps.ver.outputs.code }} \
            -PversionName=${{ steps.ver.outputs.ver }}

      - name: Locate release APK
        id: apk
        if: steps.gate.outputs.release == 'true'
        shell: bash
        run: |
          set -e
          APK=$(find . -path '*/build/outputs/apk/*' -name '*.apk' ! -name '*unsigned*' | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find . -path '*/build/outputs/apk/*' -name '*.apk' | head -n 1)
          fi
          if [ -z "$APK" ]; then
            echo "::error::No APK found under build/outputs/apk"
            exit 1
          fi
          echo "Found APK: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        if: steps.gate.outputs.release == 'true'
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KS_B64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is empty"
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > release.keystore

      - name: Sign APK
        if: steps.gate.outputs.release == 'true'
        env:
          STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            sudo apt-get update -qq >/dev/null 2>&1
            sudo apt-get install -y -qq apksigner >/dev/null 2>&1
            APKSIGNER=apksigner
          fi
          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out signed-release.apk "${{ steps.apk.outputs.path }}"
          "$APKSIGNER" verify --print-certs signed-release.apk

      - name: Prepare artifacts
        if: steps.gate.outputs.release == 'true'
        run: |
          set -e
          mkdir -p dist
          cp signed-release.apk "dist/Sali-Zai-${{ steps.ver.outputs.ver }}.apk"
          sha256sum "dist/Sali-Zai-${{ steps.ver.outputs.ver }}.apk" \
            > "dist/Sali-Zai-${{ steps.ver.outputs.ver }}.apk.sha256"

      - name: Upload build artifact (safety net)
        if: steps.gate.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk-${{ steps.ver.outputs.ver }}
          path: dist/*
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG_NAME="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists - uploading signed APK with --clobber"
            gh release upload "$TAG_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG_NAME" dist/* \
              --target "$GITHUB_SHA" \
              --title "Sali-Zai ${{ steps.ver.outputs.ver }}" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
